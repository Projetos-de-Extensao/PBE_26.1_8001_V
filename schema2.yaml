        * `CORRECAO_SOLICITADA` - Correção Solicitada
        * `SOLICITACAO_APROVADA` - Solicitação Aprovada
        * `SOLICITACAO_REPROVADA` - Solicitação Reprovada
        * `ENCAMINHAMENTO_REALIZADO` - Encaminhamento Realizado
