      - ENCAMINHADA
      type: string
      description: |-
        * `CRIADA` - Criada
        * `EM_VALIDACAO` - Em Validação
        * `CORRECAO_NECESSARIA` - Correção Necessária
        * `APROVADA` - Aprovada
        * `REPROVADA` - Reprovada
        * `ENCAMINHADA` - Encaminhada
