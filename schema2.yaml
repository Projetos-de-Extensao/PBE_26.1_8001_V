components:
  schemas:
    Aluno:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        matricula_display:
          type: string
          readOnly: true
        usuario_username:
          type: string
          readOnly: true
        nome:
          type: string
          maxLength: 200
        curso:
          type: string
          maxLength: 100
        campus:
          type: string
          nullable: true
          maxLength: 100
        data_cadastro:
          type: string
          format: date-time
          readOnly: true
        usuario:
          type: integer
          readOnly: true
      required:
      - curso
      - data_cadastro
      - id
      - matricula_display
      - nome
      - usuario
      - usuario_username
    AlunoRequest:
      type: object
      properties:
        matricula:
          type: string
          writeOnly: true
          minLength: 1
          description: Matrícula do usuário já cadastrado no sistema.
        nome:
          type: string
          minLength: 1
          maxLength: 200
        curso:
          type: string
          minLength: 1
          maxLength: 100
        campus:
          type: string
          nullable: true
          maxLength: 100
      required:
      - curso
      - matricula
      - nome
    Analise:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        coordenador_nome:
          type: string
          readOnly: true
        data_analise:
          type: string
          format: date-time
          readOnly: true
        resultado:
          $ref: '#/components/schemas/ResultadoEnum'
        observacoes:
          type: string
          nullable: true
        solicitacao:
          type: integer
        coordenador:
          type: integer
          nullable: true
      required:
      - coordenador_nome
      - data_analise
      - id
      - resultado
      - solicitacao
    AnaliseRequest:
      type: object
      properties:
        resultado:
          $ref: '#/components/schemas/ResultadoEnum'
        observacoes:
          type: string
          nullable: true
        solicitacao:
          type: integer
        coordenador:
          type: integer
          nullable: true
      required:
      - resultado
      - solicitacao
    AssinaturaDigital:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assinante_username:
          type: string
          readOnly: true
        hash_assinatura:
          type: string
          readOnly: true
        data_assinatura:
          type: string
          format: date-time
          readOnly: true
        valida:
          type: boolean
        documento:
          type: integer
        assinante:
          type: integer
          readOnly: true
      required:
      - assinante
      - assinante_username
      - data_assinatura
      - documento
      - hash_assinatura
      - id
    AssinaturaDigitalRequest:
      type: object
      properties:
        valida:
          type: boolean
        documento:
          type: integer
      required:
      - documento
    Checklist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemChecklist'
          readOnly: true
        completo:
          type: boolean
        data_criacao:
          type: string
          format: date-time
          readOnly: true
        data_atualizacao:
          type: string
          format: date-time
          readOnly: true
        solicitacao:
          type: integer
        modelo_documento:
          type: array
          items:
            type: integer
          readOnly: true
      required:
      - data_atualizacao
      - data_criacao
      - id
      - itens
      - modelo_documento
      - solicitacao
    ChecklistRequest:
      type: object
      properties:
        completo:
          type: boolean
        solicitacao:
          type: integer
      required:
      - solicitacao
    Coordenador:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        matricula_display:
          type: string
          readOnly: true
        usuario_username:
          type: string
          readOnly: true
        nome:
          type: string
          maxLength: 200
        setor:
          type: string
          maxLength: 100
        usuario:
          type: integer
          readOnly: true
      required:
      - id
      - matricula_display
      - nome
      - setor
      - usuario
      - usuario_username
    CoordenadorRequest:
      type: object
      properties:
        matricula:
          type: string
          writeOnly: true
          minLength: 1
          description: Matrícula/Identificador do usuário já cadastrado no sistema.
        nome:
          type: string
          minLength: 1
          maxLength: 200
        setor:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - matricula
      - nome
      - setor
    Documento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
        tipo:
          type: string
          maxLength: 50
        arquivo:
          type: string
